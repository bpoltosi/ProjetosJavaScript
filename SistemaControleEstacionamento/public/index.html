<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema Controle de Estacionamento</title>
  <style>
    :root { color-scheme: light; font-family: Consolas, "Courier New", monospace; background: #111a1c; color: #e8f1e8; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { width: min(100%, 720px); border: 3px solid #8eb78c; box-shadow: 8px 8px 0 #080d0e; background: #1c2928; padding: 24px; }
    h1 { margin-top: 0; color: #c7f0a8; font-size: clamp(1.25rem, 4vw, 2rem); }
    p { line-height: 1.6; }
    code { color: #f3d47b; }
    #status { padding: 12px; border: 2px solid #647d69; background: #13201d; }
    a { color: #b7dbff; }
  </style>
</head>
<body>
  <main>
    <h1>SISTEMA DE CONTROLE DE ESTACIONAMENTO</h1>
    <p>Servidor web iniciado. A interface operacional completa será conectada nesta base.</p>
    <p id="status" role="status">Verificando API...</p>
    <p>Rotas: <a href="/api/health">saúde</a> · <a href="/api/estado">estado</a> · <a href="/api/vagas">vagas</a> · <a href="/api/eventos">eventos</a></p>
  </main>
  <script>
    fetch('/api/health')
      .then((resposta) => resposta.json())
      .then((dados) => {
        const configuracao = dados.configuracaoNecessaria
          ? 'Configuração inicial pendente.'
          : 'Estacionamento configurado e pronto.';
        document.querySelector('#status').textContent = 'API online · ' + configuracao;
      })
      .catch(() => {
        document.querySelector('#status').textContent = 'Não foi possível conectar à API.';
      });
  </script>
</body>
</html>
